<!DOCTYPE html>
<html lang="en"
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miguel Angel Quiroz - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *:after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #f8f7f4;
    --bg-card: #ffffff;
    --text: #1a1a18;
    --text-muted: #6b6b66;
    --accent: #1a3a2a;
    --accent-light: #e8f0eb;
    --accent-mid: #3a6b50;
    --border: #e2e0d8;
    --hack-bg: #000000;
    --hack-green: #00ff41;
    --hack-green-dim: #00cc33;
    --hack-green-dark: #0d2a0d;
    --hack-border: #1a4a1a;
    --hack-surface: #050f05;
    --hack-muted: #2a6a2a;
}

html { scroll-behavior: smooth; }

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
}

</style>
</head>
